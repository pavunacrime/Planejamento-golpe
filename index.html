<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo Rádio - Ao Vivo</title>
    <!-- Importando a fonte Inter e FontAwesome para ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Cabeçalho */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(19, 27, 46, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: var(--primary);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--primary);
        }

        /* Seção Principal (Hero Player) */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            flex: 1;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 10px #ef4444;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .album-art {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            margin: 0 auto 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--primary-glow);
            position: relative;
        }

        .album-art i {
            font-size: 60px;
            color: white;
        }

        /* Animação das ondas quando tocando */
        .playing-waves {
            display: none;
            gap: 4px;
            align-items: flex-end;
            height: 30px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .playing-waves span {
            width: 4px;
            background: var(--primary);
            border-radius: 2px;
            animation: wave 1s infinite ease-in-out;
        }

        .playing-waves span:nth-child(2) { animation-delay: 0.2s; }
        .playing-waves span:nth-child(3) { animation-delay: 0.4s; }
        .playing-waves span:nth-child(4) { animation-delay: 0.6s; }

        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 30px; }
        }

        .track-info {
            margin-bottom: 30px;
        }

        .track-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .play-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 10px 20px var(--primary-glow);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 25px var(--primary-glow);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 80%;
            color: var(--text-muted);
        }

        .volume-control input[type="range"] {
            flex: 1;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Rodapé */
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(19, 27, 46, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Responsivo para celular */
        @media(max-width: 600px) {
            nav { display: none; }
            .player-card { padding: 25px; }
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-radio"></i> Fluxo Rádio
        </div>
        <nav>
            <ul>
                <li><a href="/Fluxo-R-dio/index.html" class="active">Início</a></li>
                <li><a href="/Fluxo-R-dio/programacao.html">Programação</a></li>
                <li><a href="/Fluxo-R-dio/locutores.html">Locutores</a></li>
                <li><a href="/Fluxo-R-dio/contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo Principal com o Player -->
    <main>
        <div class="player-card">
            <div class="live-badge">
                <span class="live-dot"></span> No Ar
            </div>

            <div class="album-art" id="artGlow">
                <i class="fa-solid fa-music" id="artIcon"></i>
            </div>

            <!-- Ondas sonoras animadas -->
            <div class="playing-waves" id="waves">
                <span></span><span></span><span></span><span></span>
            </div>

            <div class="track-info">
                <div class="track-title" id="trackTitle">Transmitindo ao Vivo</div>
                <div class="track-artist" id="trackArtist">Fluxo Rádio Web</div>
            </div>

            <div class="controls">
                <button class="play-btn" id="playBtn" onclick="togglePlay()">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </button>

                <div class="volume-control">
                    <i class="fa-solid fa-volume-low"></i>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" oninput="changeVolume(this.value)">
                    <i class="fa-solid fa-volume-high"></i>
                </div>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 Fluxo Rádio. Todos os direitos reservados.</p>
    </footer>

    <!-- Elemento de Áudio Oculto com o link do Caster.fm configurado -->
    <audio id="audioStream" preload="none">
        <source src="http://morcast.caster.fm:17533/DsczT" type="audio/mpeg">
        Seu navegador não suporta o player de áudio.
    </audio>

    <script>
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const waves = document.getElementById('waves');
        const albumArt = document.getElementById('artGlow');
        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                audio.src = ""; 
                audio.src = "http://morcast.caster.fm:17533/DsczT"; 
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                waves.style.display = 'none';
                albumArt.style.animation = 'none';
                isPlaying = false;
            } else {
                audio.src = "http://morcast.caster.fm:17533/DsczT";
                audio.load();
                audio.play().then(() => {
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.add('fa-pause');
                    waves.style.display = 'flex';
                    albumArt.style.animation = 'pulse 2s infinite';
                    isPlaying = true;
                }).catch(error => {
                    alert("Não foi possível conectar ao servidor de streaming. Verifique se o servidor está online no painel do Caster.fm.");
                    console.error(error);
                });
            }
        }

        function changeVolume(val) {
            audio.volume = val;
        }
    </script>
</body>
</html>
