<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Planejamento de Golpes</title>
    <style>
        :root {
            --board-bg: #2c221e;
            --paper-bg: #f4ecd8;
            --polaroid-bg: #fff;
            --text-dark: #222;
            --accent-red: #b33939;
            --accent-yellow: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--board-bg);
            background-image: radial-gradient(circle, #3d3028 10%, #2c221e 90%);
            color: var(--paper-bg);
            font-family: 'Courier New', Courier, monospace, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed #5a4539;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-yellow);
            text-shadow: 2px 2px #000;
        }

        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media(max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar de Golpes */
        .sidebar {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #5a4539;
            padding: 15px;
            border-radius: 4px;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            border-bottom: 1px solid #5a4539;
            padding-bottom: 5px;
        }

        .heist-list {
            list-style: none;
            margin-bottom: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .heist-item {
            padding: 8px 10px;
            margin-bottom: 5px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: 0.2s;
        }

        .heist-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .heist-item.active {
            border-left-color: var(--accent-yellow);
            background: rgba(241, 196, 15, 0.1);
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 10px;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            background: #1a1412;
            border: 1px solid #5a4539;
            color: var(--paper-bg);
            font-family: inherit;
            border-radius: 3px;
        }

        button {
            background: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            border-radius: 3px;
            transition: 0.2s;
        }

        button:hover {
            background: #d4ac0d;
        }

        /* Quadro Estilo GTA V */
        .board {
            background-color: var(--paper-bg);
            color: var(--text-dark);
            border: 10px solid #4a3525;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 0 50px rgba(0,0,0,0.1);
            padding: 20px;
            min-height: 600px;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
        }

        .board-section {
            background: rgba(255,255,255,0.5);
            border: 1px dashed #b5a48b;
            padding: 15px;
            position: relative;
        }

        .board-section h3 {
            font-size: 1.1rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--text-dark);
            margin-bottom: 10px;
            padding-bottom: 3px;
            letter-spacing: 1px;
        }

        /* Estilo Polaroid / Papel Fixado */
        .polaroid {
            background: var(--polaroid-bg);
            padding: 10px 10px 25px 10px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            transform: rotate(-1deg);
            margin-bottom: 15px;
            position: relative;
        }

        .polaroid::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: var(--accent-red);
            border-radius: 50%;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        /* Listas de Objetivos */
        .objective-list {
            list-style: none;
        }

        .objective-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.03);
            padding: 6px 10px;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .objective-item.completed span {
            text-decoration: line-through;
            color: #7f8c8d;
        }

        .objective-item input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .delete-btn {
            background: transparent;
            color: var(--accent-red);
            border: none;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            padding: 0 5px;
            font-size: 1rem;
        }

        .delete-btn:hover {
            color: #ff0000;
            background: transparent;
        }

        .full-width {
            grid-column: span 2;
        }

        .empty-state {
            text-align: center;
            font-style: italic;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Painel de Planejamento de Golpes</h1>
        <p>Organize seus alvos, missões preparatórias e o plano final.</p>
    </header>

    <div class="container">
        <!-- MENU LATERAL -->
        <div class="sidebar">
            <h2>Seus Golpes</h2>
            <ul id="heistList" class="heist-list">
                <!-- Inserido via JS -->
            </ul>

            <div class="form-group">
                <label for="newHeistName">Novo Golpe:</label>
                <input type="text" id="newHeistName" placeholder="Ex: O Cassino Diamond">
            </div>
            <button onclick="createHeist()">Criar Golpe</button>
        </div>

        <!-- QUADRO DE CORTIÇA / TELA DE PLANEJAMENTO -->
        <div class="board" id="boardContainer">
            <div class="empty-state full-width">Selecione ou crie um golpe ao lado para começar o planejamento.</div>
        </div>
    </div>

    <script>
        // Estrutura de dados inicial simulada no localStorage
        let golpes = JSON.parse(localStorage.getItem('golpes_gta')) || [
            {
                id: 1,
                nome: "O Assalto ao Banco Central",
                alvo: "Cofre Principal - 40 Milhões",
                objetivos: [
                    { texto: "Roubar cartões de acesso da segurança", concluido: true },
                    { texto: "Conseguir veículos de fuga customizados", concluido: false },
                    { texto: "Adquirir brocas a laser avançadas", concluido: false }
                ],
                planoFinal: "Entrar disfarçados de equipe de manutenção pela tubulação de ar, hackear os terminais silenciosamente e extrair pelos fundos com as motos."
            }
        ];

        let golpeAtualId = golpes.length > 0 ? golpes[0].id : null;

        function salvarDados() {
            localStorage.setItem('golpes_gta', JSON.stringify(golpes));
        }

        function renderSidebar() {
            const list = document.getElementById('heistList');
            list.innerHTML = '';
            
            golpes.forEach(g => {
                const li = document.createElement('li');
                li.className = `heist-item ${g.id === golpeAtualId ? 'active' : ''}`;
                li.innerText = g.nome;
                li.onclick = () => {
                    golpeAtualId = g.id;
                    renderSidebar();
                    renderBoard();
                };
                list.appendChild(li);
            });
        }

        function createHeist() {
            const input = document.getElementById('newHeistName');
            const nome = input.value.trim();
            if(!nome) return alert('Digite um nome para o golpe!');

            const novoGolpe = {
                id: Date.now(),
                nome: nome,
                alvo: "Definir Alvo...",
                objetivos: [],
                planoFinal: "Descrever o plano de execução final..."
            };

            golpes.push(novoGolpe);
            golpeAtualId = novoGolpe.id;
            input.value = '';
            salvarDados();
            renderSidebar();
            renderBoard();
        }

        function renderBoard() {
            const container = document.getElementById('boardContainer');
            const golpe = golpes.find(g => g.id === golpeAtualId);

            if(!golpe) {
                container.innerHTML = `<div class="empty-state full-width">Selecione ou crie um golpe ao lado para começar o planejamento.</div>`;
                return;
            }

            container.innerHTML = `
                <!-- SEÇÃO 1: ALVO -->
                <div class="board-section">
                    <h3>Alvo / Objetivo Principal</h3>
                    <div class="polaroid" style="margin-top: 10px;">
                        <input type="text" value="${golpe.alvo}" onchange="atualizarAlvo(this.value)" style="border:none; background:transparent; font-weight:bold; font-size:1.1rem; width:100%;">
                        <small style="color:#666; display:block; margin-top:5px;">(Clique para editar o alvo)</small>
                    </div>
                </div>

                <!-- SEÇÃO 2: MISSÕES / A FAZER -->
                <div class="board-section">
                    <h3>Missões Preparatórias</h3>
                    <ul class="objective-list" id="objectiveList">
                        ${golpe.objetivos.map((obj, index) => `
                            <li class="objective-item ${obj.concluido ? 'completed' : ''}">
                                <label style="display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer;">
                                    <input type="checkbox" ${obj.concluido ? 'checked' : ''} onclick="toggleObjetivo(${index})">
                                    <span>${obj.texto}</span>
                                </label>
                                <button class="delete-btn" onclick="removerObjetivo(${index})">×</button>
                            </li>
                        `).join('')}
                    </ul>
                    <div style="margin-top: 10px; display: flex; gap: 5px;">
                        <input type="text" id="novoObjText" placeholder="Nova missão preparatória...">
                        <button onclick="adicionarObjetivo()" style="width: auto;">Adicionar</button>
                    </div>
                </div>

                <!-- SEÇÃO 3: PLANO FINAL -->
                <div class="board-section full-width">
                    <h3>Plano Final de Execução</h3>
                    <textarea rows="4" onchange="atualizarPlanoFinal(this.value)" placeholder="Descreva os passos da abordagem final...">${golpe.planoFinal}</textarea>
                </div>
            `;
        }

        function atualizarAlvo(valor) {
            const golpe = golpes.find(g => g.id === golpeAtualId);
            if(golpe) {
                golpe.alvo = valor;
                salvarDados();
            }
        }

        function atualizarPlanoFinal(valor) {
            const golpe = golpes.find(g => g.id === golpeAtualId);
            if(golpe) {
                golpe.planoFinal = valor;
                salvarDados();
            }
        }

        function adicionarObjetivo() {
            const input = document.getElementById('novoObjText');
            const texto = input.value.trim();
            if(!texto) return;

            const golpe = golpes.find(g => g.id === golpeAtualId);
            if(golpe) {
                golpe.objetivos.push({ texto: texto, concluido: false });
                input.value = '';
                salvarDados();
                renderBoard();
            }
        }

        function toggleObjetivo(index) {
            const golpe = golpes.find(g => g.id === golpeAtualId);
            if(golpe && golpe.objetivos[index]) {
                golpe.objetivos[index].concluido = !golpe.objetivos[index].concluido;
                salvarDados();
                renderBoard();
            }
        }

        function removerObjetivo(index) {
            const golpe = golpes.find(g => g.id === golpeAtualId);
            if(golpe) {
                golpe.objetivos.splice(index, 1);
                salvarDados();
                renderBoard();
            }
        }

        // Inicialização do carregamento da página
        renderSidebar();
        renderBoard();
    </script>
</body>
</html>
