<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #60a5fa; font-size: 20px; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 4px; box-sizing: border-box; }
        input { background: #334155; color: #fff; }
        button { background: #3b82f6; color: #white; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
        ul { list-style: none; padding: 0; }
        li { background: #334155; margin-top: 5px; padding: 8px; border-radius: 4px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Meu Controle de Gastos</h1>
        <input type="text" id="descricao" placeholder="Descrição do Gasto">
        <input type="number" id="valor" placeholder="Valor (R$)">
        <button onclick="adicionarGasto()">Adicionar Gasto</button>
        
        <h3>Histórico:</h3>
        <ul id="lista"></ul>
        <h3 id="total">Total: R$ 0,00</h3>
    </div>

    <script>
        let totalGeral = 0;
        function adicionarGasto() {
            let desc = document.getElementById('descricao').value;
            let val = parseFloat(document.getElementById('valor').value);
            
            if(!desc || isNaN(val)) {
                alert('Preencha todos os campos corretamente!');
                return;
            }

            let lista = document.getElementById('lista');
            let item = document.createElement('li');
            item.innerHTML = `<span>${desc}</span> <span>R$ ${val.toFixed(2)}</span>`;
            lista.appendChild(item);

            totalGeral += val;
            document.getElementById('total').innerText = `Total: R$ ${totalGeral.toFixed(2)}`;

            document.getElementById('descricao').value = '';
            document.getElementById('valor').value = '';
        }
    </script>
</body>
</html>
