<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Fluxo Rádio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(19, 27, 46, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--primary); }
        nav ul { display: flex; list-style: none; gap: 25px; }
        nav a { text-decoration: none; color: var(--text-muted); font-weight: 600; transition: color 0.3s; }
        nav a:hover, nav a.active { color: var(--primary); }
        main { padding: 40px 20px; max-width: 600px; margin: 0 auto; width: 100%; flex: 1; }
        h1 { font-size: 2rem; margin-bottom: 20px; text-align: center; }
        .contact-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.08); padding: 30px; border-radius: 16px; text-align: center; }
        .contact-card p { color: var(--text-muted); margin-bottom: 25px; }
        .contact-options { display: flex; justify-content: center; gap: 20px; }
        .btn-contact { background: var(--primary); color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; transition: background 0.3s; }
        .btn-contact:hover { background: #2563eb; }
        footer { text-align: center; padding: 20px; background: rgba(19, 27, 46, 0.8); border-top: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><i class="fa-solid fa-radio"></i> Fluxo Rádio</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="programacao.html">Programação</a></li>
                <li><a href="locutores.html">Locutores</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Fale Conosco</h1>
        <div class="contact-card">
            <p>Mande sua mensagem, peça sua música ou tire suas dúvidas através dos nossos canais oficiais:</p>
            <div class="contact-options">
                <a href="https://wa.me/5599999999999" target="_blank" class="btn-contact"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                <a href="mailto:contato@fluxoradio.com" class="btn-contact" style="background: var(--accent);"><i class="fa-solid fa-envelope"></i> E-mail</a>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 Fluxo Rádio. Todos os direitos reservados.</p></footer>
</body>
</html>
