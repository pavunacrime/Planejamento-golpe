<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locutores - Fluxo Rádio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(19, 27, 46, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--primary); }
        nav ul { display: flex; list-style: none; gap: 25px; }
        nav a { text-decoration: none; color: var(--text-muted); font-weight: 600; transition: color 0.3s; }
        nav a:hover, nav a.active { color: var(--primary); }
        main { padding: 40px 20px; max-width: 900px; margin: 0 auto; width: 100%; flex: 1; }
        h1 { font-size: 2rem; margin-bottom: 30px; text-align: center; }
        .grid-locutores { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card-locutor { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 25px; text-align: center; }
        .card-locutor img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 2px solid var(--primary); }
        .card-locutor h3 { font-size: 1.2rem; margin-bottom: 5px; }
        .card-locutor p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }
        .social-links { display: flex; justify-content: center; gap: 15px; }
        .social-links a { color: var(--text-main); background: rgba(255,255,255,0.05); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: background 0.3s; }
        .social-links a:hover { background: var(--primary); }
        footer { text-align: center; padding: 20px; background: rgba(19, 27, 46, 0.8); border-top: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><i class="fa-solid fa-radio"></i> Fluxo Rádio</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="programacao.html">Programação</a></li>
                <li><a href="locutores.html" class="active">Locutores</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Nossa Equipe</h1>
        <div class="grid-locutores">
            <div class="card-locutor">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Locutor 1">
                <h3>Ana Souza</h3>
                <p>Locutora do Manhã Total</p>
                <div class="social-links">
                    <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://wa.me/" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
            </div>
            <div class="card-locutor">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300" alt="Locutor 2">
                <h3>Carlos Lima</h3>
                <p>Apresentador do Tarde Hits</p>
                <div class="social-links">
                    <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://wa.me/" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 Fluxo Rádio. Todos os direitos reservados.</p></footer>
</body>
</html>
